<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 305"
     font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">

  <defs>
    <!-- Primary arrowhead (dark, solid) -->
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 7 3.5, 0 7" fill="#333333"/>
    </marker>
    <!-- Secondary arrowhead (light, for internal + not-useful) -->
    <marker id="arr-sm" markerWidth="6" markerHeight="6" refX="4.5" refY="3"
            orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 6 3, 0 6" fill="#888888"/>
    </marker>
  </defs>

  <!-- ═══════════════════════════════════ BACKGROUND ═══════════════════════════════════ -->
  <rect width="1060" height="305" fill="white" stroke="#BBBBBB" stroke-width="0.8"/>

  <!-- ═══════════════════════════════════ STAGE GROUPS ═══════════════════════════════════ -->

  <!-- Stage I: Input — red -->
  <rect x="10" y="95" width="110" height="150" rx="2"
        fill="#FEF0F3" stroke="#AAAAAA" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="65" y="89" text-anchor="middle"
        font-size="7.5" fill="#999999" font-weight="600" letter-spacing="0.6">STAGE I · INPUT</text>

  <!-- Stage II: Preprocessing — blue -->
  <rect x="160" y="95" width="200" height="150" rx="2"
        fill="#EEF5FB" stroke="#AAAAAA" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="260" y="89" text-anchor="middle"
        font-size="7.5" fill="#999999" font-weight="600" letter-spacing="0.6">STAGE II · PREPROCESSING</text>

  <!-- Stage III: Classification — amber -->
  <rect x="400" y="95" width="210" height="150" rx="2"
        fill="#FEFAF0" stroke="#AAAAAA" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="505" y="89" text-anchor="middle"
        font-size="7.5" fill="#999999" font-weight="600" letter-spacing="0.6">STAGE III · CLASSIFICATION</text>

  <!-- Stage IV: LLM Extraction — green -->
  <rect x="650" y="95" width="145" height="150" rx="2"
        fill="#EEF8F1" stroke="#AAAAAA" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="722" y="89" text-anchor="middle"
        font-size="7.5" fill="#999999" font-weight="600" letter-spacing="0.6">STAGE IV · EXTRACTION</text>

  <!-- Stage V: Output — lavender -->
  <rect x="835" y="95" width="215" height="150" rx="2"
        fill="#F4EEFB" stroke="#AAAAAA" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="942" y="89" text-anchor="middle"
        font-size="7.5" fill="#999999" font-weight="600" letter-spacing="0.6">STAGE V · OUTPUT</text>

  <!-- ═══════════════════════════════════ COMPONENT BOXES ═══════════════════════════════════ -->

  <!-- Stage I — PDF Files -->
  <rect x="20" y="138" width="90" height="64"
        fill="#F8C0CC" stroke="#444444" stroke-width="0.9"/>
  <text x="65" y="163" text-anchor="middle"
        font-size="11" font-weight="700" fill="#111111">PDF Files</text>
  <text x="65" y="178" text-anchor="middle"
        font-size="8.5" fill="#555555">Single file or folder</text>

  <!-- Stage II — Text Extraction -->
  <rect x="170" y="112" width="180" height="48"
        fill="#D9EDF7" stroke="#444444" stroke-width="0.9"/>
  <text x="260" y="131" text-anchor="middle"
        font-size="11" font-weight="700" fill="#111111">Text Extraction</text>
  <text x="260" y="147" text-anchor="middle"
        font-size="8.5" fill="#555555">PyMuPDF  ·  Tesseract OCR</text>

  <!-- internal arrow: Extraction → Cleaning -->
  <line x1="260" y1="160" x2="260" y2="171"
        stroke="#888888" stroke-width="1" marker-end="url(#arr-sm)"/>

  <!-- Stage II — Text Cleaning -->
  <rect x="170" y="172" width="180" height="48"
        fill="#D9EDF7" stroke="#444444" stroke-width="0.9"/>
  <text x="260" y="191" text-anchor="middle"
        font-size="11" font-weight="700" fill="#111111">Text Cleaning</text>
  <text x="260" y="207" text-anchor="middle"
        font-size="8.5" fill="#555555">Section Filtering</text>

  <!-- Stage III — TF-IDF Vectorizer -->
  <rect x="410" y="112" width="190" height="48"
        fill="#FDEFC3" stroke="#444444" stroke-width="0.9"/>
  <text x="505" y="131" text-anchor="middle"
        font-size="11" font-weight="700" fill="#111111">TF-IDF Vectorizer</text>
  <text x="505" y="147" text-anchor="middle"
        font-size="8.5" fill="#555555">Feature extraction</text>

  <!-- internal arrow: TF-IDF → XGBoost -->
  <line x1="505" y1="160" x2="505" y2="171"
        stroke="#888888" stroke-width="1" marker-end="url(#arr-sm)"/>

  <!-- Stage III — XGBoost Classifier -->
  <rect x="410" y="172" width="190" height="48"
        fill="#FDEFC3" stroke="#444444" stroke-width="0.9"/>
  <text x="505" y="191" text-anchor="middle"
        font-size="11" font-weight="700" fill="#111111">XGBoost Classifier</text>
  <text x="505" y="207" text-anchor="middle"
        font-size="8.5" fill="#555555">Binary classification</text>

  <!-- Stage IV — LLM Extraction -->
  <rect x="659" y="138" width="127" height="64"
        fill="#C9EDD4" stroke="#444444" stroke-width="0.9"/>
  <text x="722" y="163" text-anchor="middle"
        font-size="11" font-weight="700" fill="#111111">LLM Extraction</text>
  <text x="722" y="178" text-anchor="middle"
        font-size="8.5" fill="#555555">Ollama  (local)</text>

  <!-- Stage V — JSON -->
  <rect x="845" y="112" width="195" height="48"
        fill="#E8D9F5" stroke="#444444" stroke-width="0.9"/>
  <text x="942" y="131" text-anchor="middle"
        font-size="11" font-weight="700" fill="#111111">JSON</text>
  <text x="942" y="147" text-anchor="middle"
        font-size="8.5" fill="#555555">Structured metrics</text>

  <!-- Stage V — Pipeline Summary CSV -->
  <rect x="845" y="172" width="195" height="48"
        fill="#E8D9F5" stroke="#444444" stroke-width="0.9"/>
  <text x="942" y="191" text-anchor="middle"
        font-size="11" font-weight="700" fill="#111111">Pipeline Summary</text>
  <text x="942" y="207" text-anchor="middle"
        font-size="8.5" fill="#555555">Aggregated CSV</text>

  <!-- ═══════════════════════════════════ MAIN FLOW ARROWS ═══════════════════════════════════ -->

  <!-- Stage I → II -->
  <line x1="120" y1="170" x2="160" y2="170"
        stroke="#333333" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Stage II → III -->
  <line x1="360" y1="170" x2="400" y2="170"
        stroke="#333333" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Stage III → IV  (Useful path) -->
  <line x1="610" y1="170" x2="650" y2="170"
        stroke="#333333" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="630" y="163" text-anchor="middle"
        font-size="8" fill="#444444" font-style="italic">Useful</text>

  <!-- Stage IV → V -->
  <line x1="795" y1="170" x2="835" y2="170"
        stroke="#333333" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- ═══════════════════════════════════ NOT USEFUL BRANCH ═══════════════════════════════════ -->

  <!-- Path: XGBoost bottom → down → right → up into Stage V bottom box -->
  <path d="M 505 220 L 505 263 L 942 263 L 942 220"
        fill="none" stroke="#999999" stroke-width="1"
        stroke-dasharray="5,3.5" marker-end="url(#arr-sm)"/>

  <!-- "Not Useful" label on downward segment -->
  <text x="518" y="258" font-size="8" fill="#888888" font-style="italic">Not Useful</text>

  <!-- annotation below horizontal segment -->
  <text x="723" y="278" text-anchor="middle"
        font-size="7.5" fill="#BBBBBB">confidence score recorded — paper skipped</text>

</svg>
